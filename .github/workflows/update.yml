name: עדכון יומן ברצלונה

on:
  schedule:
    - cron: "17 */6 * * *"   # כל 6 שעות
  workflow_dispatch:          # כפתור "Run workflow" להרצה ידנית

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python barca_calendar.py
      - name: שמירת הקובץ אם השתנה
        run: |
          git config user.name "barca-bot"
          git config user.email "barca-bot@users.noreply.github.com"
          git add barca.ics
          git diff --cached --quiet || (git commit -m "עדכון משחקים" && git push)
